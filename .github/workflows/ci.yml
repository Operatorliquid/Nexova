name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  critical-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint hardened SSRF surface
        run: pnpm lint:security

      - name: Build internal workspace packages
        run: |
          pnpm --filter @nexova/shared build
          pnpm --filter @nexova/core build
          pnpm --filter @nexova/integrations build
          pnpm --filter @nexova/retail build
          pnpm --filter @nexova/agent-runtime build

      - name: Typecheck critical packages
        run: |
          pnpm --filter @nexova/api typecheck
          pnpm --filter @nexova/worker typecheck
          pnpm --filter @nexova/agent-runtime typecheck

      - name: Run critical package tests
        run: |
          pnpm --filter @nexova/api test
          pnpm --filter @nexova/worker test
          pnpm --filter @nexova/agent-runtime test
